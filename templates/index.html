{% extends "layout.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="text-center mb-12">
        <h2 class="text-4xl font-bold text-white mb-4 tracking-tight">Transform Technical Incidents</h2>
        <p class="text-lg text-slate-400 max-w-2xl mx-auto">
            Convert complex engineering details into clear, professional customer-facing Root Cause Analysis documents
            instantly using AI.
        </p>
    </div>

    <form action="/generate" method="post"
        class="glass-panel rounded-2xl p-8 md:p-10 shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 via-purple-500 to-indigo-600">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            <div class="space-y-4">
                <label for="title" class="block text-sm font-semibold text-slate-300">Incident Title</label>
                <input type="text" name="title" id="title" required placeholder="e.g. Production Database Latency Spike"
                    class="input-premium w-full rounded-xl px-4 py-3">
            </div>

            <div class="space-y-4">
                <label for="date" class="block text-sm font-semibold text-slate-300">Date of Incident</label>
                <input type="date" name="date" id="date" required class="input-premium w-full rounded-xl px-4 py-3">
            </div>
        </div>

        <div class="space-y-8">
            <div class="space-y-4">
                <label for="impact" class="block text-sm font-semibold text-slate-300">Summary of Impact</label>
                <textarea name="impact" id="impact" rows="3" required placeholder="How were users affected?"
                    class="input-premium w-full rounded-xl px-4 py-3 font-mono text-sm"></textarea>
            </div>

            <div class="space-y-4">
                <label for="root_cause" class="block text-sm font-semibold text-slate-300">Root Cause</label>
                <textarea name="root_cause" id="root_cause" rows="3" required
                    placeholder="What was the underlying technical issue?"
                    class="input-premium w-full rounded-xl px-4 py-3 font-mono text-sm"></textarea>
            </div>

            <div class="space-y-4">
                <label for="resolution" class="block text-sm font-semibold text-slate-300">Resolution</label>
                <textarea name="resolution" id="resolution" rows="2" required placeholder="How was it fixed?"
                    class="input-premium w-full rounded-xl px-4 py-3"></textarea>
            </div>

            <div class="space-y-4">
                <label for="remediations" class="block text-sm font-semibold text-slate-300">Remediations</label>
                <textarea name="remediations" id="remediations" rows="2" required
                    placeholder="What steps are being taken to prevent recurrence?"
                    class="input-premium w-full rounded-xl px-4 py-3"></textarea>
            </div>


            <div class="pt-6 border-t border-slate-700/50 mb-6">
                <div class="flex items-center justify-between mb-4">
                    <label for="reference_rca" class="block text-sm font-semibold text-slate-300">Reference / Example
                        RCA (Optional)</label>
                    <span
                        class="text-xs text-brand-400 bg-brand-900/50 border border-brand-500/30 px-2 py-1 rounded-full font-medium">Style
                        Guide</span>
                </div>
                <textarea name="reference_rca" id="reference_rca" rows="6"
                    placeholder="Paste a previous completed RCA here. The AI will learn the tone and style from this example."
                    class="input-premium w-full rounded-xl px-4 py-3 font-mono text-xs"></textarea>
            </div>

            <div class="pt-6 border-t border-slate-700/50">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-6">
                    <div class="space-y-2">
                        <label for="provider" class="block text-sm font-semibold text-slate-300">AI Provider</label>
                        <select name="provider" id="provider" onchange="toggleModelSelect()"
                            class="input-premium w-full rounded-xl px-4 py-3 cursor-pointer appearance-none">
                            <option value="gemini" class="bg-slate-900">Google Gemini</option>
                            <option value="github" class="bg-slate-900">GitHub Models</option>
                        </select>
                    </div>

                    <div id="model-select-container" class="space-y-2 hidden">
                        <label for="model_name" class="block text-sm font-semibold text-slate-300">Model</label>
                        <select name="model_name" id="model_name"
                            class="input-premium w-full rounded-xl px-4 py-3 cursor-pointer appearance-none">
                            <option value="gpt-4o" class="bg-slate-900">GPT-4o</option>
                            <option value="gpt-4o-mini" class="bg-slate-900">GPT-4o Mini</option>
                            <option value="Phi-3-medium-4k-instruct" class="bg-slate-900">Phi-3 Medium</option>
                            <option value="Phi-3-mini-4k-instruct" class="bg-slate-900">Phi-3 Mini</option>
                            <option value="Llama-3.2-90B-Vision-Instruct" class="bg-slate-900">Llama 3.2 90B</option>
                            <option value="Mistral-large-2411" class="bg-slate-900">Mistral Large</option>
                        </select>
                    </div>
                </div>

                <label for="api_key" class="block text-sm font-semibold text-slate-300 mb-2">
                    <span id="api-key-label">Gemini API Key</span>
                    <span class="text-slate-500 font-normal">(Optional if set in env)</span>
                </label>
                <input type="password" name="api_key" id="api_key" placeholder="Key..."
                    class="input-premium w-full rounded-xl px-4 py-3 mb-2">
                <p class="text-xs text-slate-500">Your key is never stored, only used for this session.</p>
            </div>
        </div>

        <script>
            function toggleModelSelect() {
                const provider = document.getElementById('provider').value;
                const modelContainer = document.getElementById('model-select-container');
                const label = document.getElementById('api-key-label');

                if (provider === 'github') {
                    modelContainer.classList.remove('hidden');
                    label.textContent = "GitHub Personal Access Token";
                } else {
                    modelContainer.classList.add('hidden');
                    label.textContent = "Gemini API Key";
                }
            }
        </script>

        <div class="mt-10 flex justify-end">
            <button type="submit"
                class="group relative inline-flex items-center justify-center overflow-hidden rounded-xl bg-brand-600 px-8 py-4 font-medium text-white shadow-2xl transition-all duration-300 hover:bg-brand-500 hover:scale-[1.02] hover:shadow-brand-500/25">
                <span class="mr-2">Generate Customer RCA</span>
                <svg class="h-5 w-5 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>
        </div>
    </form>
</div>
{% endblock %}
