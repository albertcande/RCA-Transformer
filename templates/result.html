{% extends "layout.html" %}

{% block content %}
<div class="max-w-4xl mx-auto">
    <div class="mb-8 flex items-center justify-between">
        <a href="/" class="flex items-center text-sm font-medium text-slate-400 hover:text-white transition-colors">
            <svg class="w-4 h-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Back to Editor
        </a>
        <h2 class="text-2xl font-bold text-white">Generated RCA</h2>
    </div>

    <div class="glass-panel rounded-2xl overflow-hidden shadow-xl">
        <div class="bg-slate-900/50 border-b border-white/10 px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 rounded-full bg-red-400/80"></div>
                <div class="w-3 h-3 rounded-full bg-amber-400/80"></div>
                <div class="w-3 h-3 rounded-full bg-green-400/80"></div>
            </div>
            <button onclick="copyContent()"
                class="text-xs font-semibold uppercase tracking-wider text-brand-300 hover:text-white bg-brand-900/50 hover:bg-brand-800/50 border border-brand-500/30 px-4 py-2 rounded-lg transition-colors">
                Copy Markdown
            </button>
        </div>
        <div class="p-8 md:p-12 overflow-x-auto">
            <pre id="rca-content"
                class="whitespace-pre-wrap font-mono text-sm text-slate-300 leading-relaxed">{{ rca_content }}</pre>
        </div>
    </div>

    <div class="mt-8 text-center space-y-4">
        <p class="text-slate-500 text-sm">Not satisfied? Try regenerating with more specific details.</p>
        <button onclick="window.history.back()" class="text-slate-300 font-medium hover:text-white hover:underline">Edit
            Inputs</button>
    </div>
</div>

<script>
    function copyContent() {
        const content = document.getElementById('rca-content').innerText;
        navigator.clipboard.writeText(content).then(() => {
            alert('Copied to clipboard!');
        });
    }
</script>
{% endblock %}
